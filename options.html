<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一键存图 - 设置</title>
  <link rel="stylesheet" href="styles/options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>⚙️ 一键存图设置</h1>
    </header>

    <main class="main">
      <!-- 下载设置 -->
      <section class="section">
        <h2>📥 下载设置</h2>
        
        <div class="form-group">
          <label for="downloadPath">
            下载目录
            <span class="hint">（Chrome 下载目录下的子目录）</span>
          </label>
          <input type="text" id="downloadPath" placeholder="Downloaded_Images" value="Downloaded_Images">
        </div>

        <div class="form-group">
          <label for="fileNamePattern">
            文件名格式
            <span class="hint">可用变量：{date} {time} {index} {filename}</span>
          </label>
          <input type="text" id="fileNamePattern" placeholder="image_{date}_{time}_{index}" value="image_{date}_{time}_{index}">
        </div>

        <div class="form-group">
          <label for="maxConcurrent">
            最大并发下载数
            <span class="hint">同时下载的图片数量</span>
          </label>
          <input type="number" id="maxConcurrent" min="1" max="10" value="3">
        </div>
      </section>

      <!-- 图片过滤 -->
      <section class="section">
        <h2>🖼️ 图片过滤</h2>
        
        <div class="form-group">
          <label>
            默认图片格式
          </label>
          <div class="checkbox-group">
            <label class="checkbox-item">
              <input type="checkbox" name="formats" value="jpg" checked>
              <span>JPG</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" name="formats" value="jpeg" checked>
              <span>JPEG</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" name="formats" value="png" checked>
              <span>PNG</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" name="formats" value="gif" checked>
              <span>GIF</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" name="formats" value="webp" checked>
              <span>WebP</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" name="formats" value="svg">
              <span>SVG</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" name="formats" value="bmp">
              <span>BMP</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="minWidth">
            最小图片宽度
            <span class="hint">（像素）设为 0 不过滤</span>
          </label>
          <input type="number" id="minWidth" min="0" value="0">
        </div>

        <div class="form-group">
          <label for="minHeight">
            最小图片高度
            <span class="hint">（像素）设为 0 不过滤</span>
          </label>
          <input type="number" id="minHeight" min="0" value="0">
        </div>
      </section>

      <!-- 高级设置 -->
      <section class="section">
        <h2>🔧 高级设置</h2>
        
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="showNotifications">
            <span>下载完成时显示通知</span>
          </label>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="autoRename">
            <span>自动重命名重复文件</span>
          </label>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="includeDataUrl">
            <span>包含 Data URL 图片（base64）</span>
          </label>
        </div>
      </section>

      <!-- 按钮区域 -->
      <div class="button-group">
        <button class="btn btn-primary" id="saveBtn">💾 保存设置</button>
        <button class="btn btn-secondary" id="resetBtn">🔄 恢复默认</button>
      </div>
    </main>

    <footer class="footer">
      <p>图片批量下载器 v1.0.0</p>
    </footer>
  </div>

  <script src="options.js"></script>
</body>
</html>
